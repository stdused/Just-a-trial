
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My AI Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#f4f4f5;font-family:Arial,sans-serif}
main{max-width:650px;margin:auto;padding:24px}
h1{font-size:28px}
p{color:#b4b4be}
input,button,textarea{font:inherit;border-radius:10px;padding:13px;width:100%;margin:6px 0}
input,textarea{background:#202127;color:white;border:1px solid #393a44}
button{background:#8b7cff;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#30313a}
.panel{background:#191a20;border:1px solid #30313a;border-radius:16px;padding:18px;margin:14px 0}
#app{display:none}
#chats{display:flex;gap:8px;flex-wrap:wrap}
#chats button{width:auto}
#messages{min-height:150px;max-height:45vh;overflow:auto}
.msg{padding:12px;margin:8px 0;border-radius:12px;background:#252630;overflow-wrap:anywhere}
.user{background:#34304b}
small{color:#aaa}
</style>
</head>
<body>
<main>
<h1>My AI Chat</h1>
<p>Your personal chat space.</p>

<section id="auth" class="panel">
<h2>Sign in or create an account</h2>
<input id="email" type="email" placeholder="Email address" autocomplete="email">
<input id="password" type="password" placeholder="Password (at least 6 characters)" autocomplete="current-password">
<button id="signup">Create account</button>
<button id="login" class="secondary">Log in</button>
<p id="status" role="status">Enter your email and password.</p>
</section>

<section id="app">
<div class="panel">
<p id="account"></p>
<button id="logout" class="secondary">Log out</button>
</div>
<div class="panel">
<h2>Your conversations</h2>
<button id="newchat">+ New chat</button>
<div id="chats"></div>
</div>
<div class="panel">
<div id="messages"></div>
<textarea id="message" rows="3" placeholder="Write a message..."></textarea>
<button id="send">Save message</button>
<p><small>AI replies are not connected yet.</small></p>
</div>
<p id="appstatus" role="status"></p>
</section>
</main>

<script>
const SUPABASE_URL = "https://zmesdhnvvmwgegkyxfdp.supabase.co";
const SUPABASE_KEY = "sb_publishable_2ip-urcfML1-5ByCp7SuFg_IpFpeVSU";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let user = null;
let conversationId = null;

const $ = id => document.getElementById(id);
function status(message){ $("status").textContent = message; }
function appStatus(message){ $("appstatus").textContent = message; }

$("signup").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  if(!email || password.length < 6)
    return status("Enter a valid email and password of at least 6 characters.");
  const {error} = await db.auth.signUp({email,password});
  status(error ? error.message : "Check your email for the confirmation link.");
};

$("login").onclick = async () => {
  const {data,error} = await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(error) return status(error.message);
  user = data.user;
  await showApp();
};

$("logout").onclick = async () => {
  await db.auth.signOut();
  location.reload();
};

async function showApp(){
  $("auth").style.display = "none";
  $("app").style.display = "block";
  $("account").textContent = "Signed in: " + user.email;
  await loadChats();
}

async function loadChats(){
  const {data,error} = await db.from("conversations")
    .select("id,title,created_at")
    .eq("user_id",user.id)
    .order("created_at",{ascending:false});

  if(error) return appStatus("Could not load chats: " + error.message);
  $("chats").replaceChildren();

  (data || []).forEach(chat => {
    const b = document.createElement("button");
    b.className = "secondary";
    b.textContent = chat.title || "New chat";
    b.onclick = () => openChat(chat.id);
    $("chats").appendChild(b);
  });

  if(!conversationId && data && data.length)
    await openChat(data[0].id);
}

async function openChat(id){
  conversationId = id;
  $("messages").replaceChildren();
  const {data,error} = await db.from("messages")
    .select("id,role,content,created_at")
    .eq("conversation_id",id)
    .eq("user_id",user.id)
    .order("created_at",{ascending:true});

  if(error) return appStatus("Could not load messages: " + error.message);

  (data || []).forEach(addMessage);
  appStatus("");
}

function addMessage(m){
  const div = document.createElement("div");
  div.className = "msg" + (m.role === "user" ? " user" : "");
  const label = document.createElement("strong");
  label.textContent = m.role === "user" ? "You" : "Assistant";
  const body = document.createElement("p");
  body.textContent = m.content;
  div.append(label,body);
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
}

$("newchat").onclick = async () => {
  const {data,error} = await db.from("conversations")
    .insert({user_id:user.id,title:"New chat"})
    .select("id").single();

  if(error) return appStatus("Could not create chat: " + error.message);
  conversationId = data.id;
  $("messages").replaceChildren();
  await loadChats();
  appStatus("New conversation created.");
};

$("send").onclick = async () => {
  const content = $("message").value.trim();
  if(!content) return;
  if(!conversationId){
    const {data,error} = await db.from("conversations")
      .insert({user_id:user.id,title:content.slice(0,50)})
      .select("id").single();
    if(error) return appStatus("Could not create chat: " + error.message);
    conversationId = data.id;
  }

  const {data,error} = await db.from("messages")
    .insert({
      conversation_id:conversationId,
      user_id:user.id,
      role:"user",
      content
    })
    .select("id,role,content,created_at").single();

  if(error) return appStatus("Could not save message: " + error.message);
  $("message").value = "";
  addMessage(data);
  await loadChats();
  appStatus("Message saved. AI replies will be added next.");
};

(async () => {
  const {data} = await db.auth.getSession();
  if(data.session){
    user = data.session.user;
    await showApp();
  }
})();
</script>
</body>
</html>
