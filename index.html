
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My AI Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #101114;
      color: #f5f5f5;
      display: flex;
      height: 100dvh;
    }
    aside {
      width: 240px;
      padding: 20px;
      background: #191a1f;
      border-right: 1px solid #303139;
    }
    .brand { font-size: 21px; font-weight: 700; }
    .new-chat {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      border: 1px solid #454650;
      border-radius: 10px;
      background: transparent;
      color: white;
      text-align: left;
    }
    main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px 22px;
      border-bottom: 1px solid #303139;
      font-weight: 600;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .welcome {
      margin: 12vh auto 0;
      max-width: 520px;
      text-align: center;
    }
    .welcome h1 { font-size: clamp(26px, 5vw, 38px); }
    .welcome p { color: #aaaab5; }
    .message {
      max-width: 720px;
      margin: 0 auto 18px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #202127;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user { background: #293b32; }
    form {
      display: flex;
      gap: 10px;
      max-width: 800px;
      width: calc(100% - 28px);
      margin: 0 auto 18px;
      padding: 9px;
      background: #202127;
      border: 1px solid #393a43;
      border-radius: 16px;
    }
    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      max-height: 140px;
      padding: 10px;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font: inherit;
    }
    form button {
      align-self: flex-end;
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      background: #f5f5f5;
      color: #171717;
      font-weight: 600;
    }
    .note {
      padding: 0 12px 12px;
      color: #92929e;
      font-size: 12px;
      text-align: center;
    }
    @media (max-width: 600px) {
      aside { width: 66px; padding: 12px 7px; }
      .brand { font-size: 13px; overflow-wrap: anywhere; }
      .new-chat { padding: 9px 4px; font-size: 11px; }
      #messages { padding: 14px 8px; }
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">My AI</div>
    <button class="new-chat" id="newChat">＋ New chat</button>
  </aside>

  <main>
    <header>My AI Chat</header>
    <section id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <h1>What can I help with?</h1>
        <p>Your personal AI workspace starts here.</p>
      </div>
    </section>

    <form id="chatForm">
      <textarea id="prompt" rows="1"
        placeholder="Message My AI..." aria-label="Your message"
        required></textarea>
      <button type="submit">Send</button>
    </form>
    <div class="note">
      Starter interface — AI, accounts and saved chats will be connected next.
    </div>
  </main>

  <script>
    const form = document.getElementById("chatForm");
    const promptBox = document.getElementById("prompt");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");

    function addMessage(text, role) {
      welcome?.remove();
      const item = document.createElement("div");
      item.className = "message " + role;
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = promptBox.value.trim();
      if (!text) return;
      addMessage(text, "user");
      addMessage(
        "Your interface is working! AI responses will be connected in the next step.",
        "assistant"
      );
      promptBox.value = "";
    });

    document.getElementById("newChat").addEventListener("click", () => {
      messages.replaceChildren();
      const intro = document.createElement("div");
      intro.className = "welcome";
      intro.innerHTML =
        "<h1>What can I help with?</h1><p>Start a new conversation.</p>";
      messages.appendChild(intro);
    });
  </script>
</body>
</html>
